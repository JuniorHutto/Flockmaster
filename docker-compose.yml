services:
  app:
    build:
      context: .
      network: host
    ports:
      - "81:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./server
      network: host
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flockmaster}:${POSTGRES_PASSWORD:-flockmaster}@db:5432/${POSTGRES_DB:-flockmaster}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flockmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flockmaster}
      POSTGRES_DB: ${POSTGRES_DB:-flockmaster}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
